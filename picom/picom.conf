# ==========================================
# BACKEND
# ==========================================

backend = "glx";
vsync = true;

# ==========================================
# OPACITY
# ==========================================

active-opacity = 0.90;
inactive-opacity = 0.90;
frame-opacity = 0.90;

# ==========================================
# BLUR
# ==========================================

blur-background = true;
blur-background-frame = true;

blur-method = "dual_kawase";
blur-strength = 5;

# ==========================================
# SHADOWS
# ==========================================

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.25;

shadow-offset-x = -5;
shadow-offset-y = -5;

# ==========================================
# FADING
# ==========================================

fading = true;

fade-in-step = 0.05;
fade-out-step = 0.05;

# ==========================================
# PERFORMANCE
# ==========================================

detect-client-opacity = true;
use-damage = true;
